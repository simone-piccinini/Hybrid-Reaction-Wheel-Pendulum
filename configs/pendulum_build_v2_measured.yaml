# The AS-BUILT bench pendulum — PLA reaction wheel, revision v2 (Onshape).
#
# Supersedes pendulum_measured.yaml for the physical build: the printed PLA
# wheel came out LIGHTER and with LESS inertia than the earlier CAD estimate
# (I_w 1.04e-4 -> 6.117e-5 kg*m^2, 64 g -> 41 g). See
# docs/hardware/reaction_wheel_design.md for the sizing analysis of this wheel
# and why adding rim mass is NOT the fix.
#
#   wheel   : I_w = 61.1725 kg*mm^2 = 6.11725e-5 kg*m^2, m = 41.0 g, OD 102 mm
#   m_tip   : 60 g fixed (motor 39 + AS5600 10 + screws/magnet 4 + bracket 7)
#             + 41 g wheel = 101 g
#   I_b     : ~ m_tip * L^2 = 0.101 * 0.15^2 = 2.2725e-3 kg*m^2
#   motor   : GBM2804, R_a = 10 ohm, K_t = K_e = 0.037, 12 V rail

name: pendulum_build_v2_measured

seed: 0

plant:
  pendulum_mass: 0.101       # m_tip: 60 g fixed + 41 g wheel (kg)
  pendulum_length: 0.15      # 15 cm arm, pivot -> CoM (m)
  body_inertia: 0.0022725    # m_tip * L^2 (kg*m^2)
  pivot_friction: 0.01       # b_p (N*m*s/rad)  [NOT measured - placeholder]
  gravity: 9.81
  wheel:
    mass: 0.04100541         # printed PLA wheel, from Onshape (kg)
    radius: 0.051            # OD 102 mm (m)
    inertia: 6.11725e-5      # 61.1725 kg*mm^2, from Onshape (kg*m^2)
    friction_coefficient: 1.0e-4
  motor:
    resistance: 10.0
    torque_constant: 0.037
    back_emf_constant: 0.037
    max_voltage: 12.0

simulation:
  dt: 0.01
  simulation_time: 10.0
  initial_state: [0.05, 0.0, 0.0, 0.0]
  divergence_angle: 1.5708
  disturbances:
    process_std: [0.0, 1.0e-4, 0.0, 1.0e-2]
    # MEASURED on the real build (docs/hardware/sensor_characterisation.md).
    # theta_p: 0.0459 rad = 2.63 deg 1-sigma. NOT sensor noise - the pivot
    #   encoder reads 1 LSB when still, but out-of-plane wobble of the arm
    #   moves the reading by +/-4.6 deg at a FIXED true angle. Carried here as
    #   measurement noise because that is the honest way to tell the filter it
    #   cannot trust that channel; it is not white, so this is optimistic.
    # theta_w_dot: 0.4665 rad/s = sqrt(2)*sigma_angle/dt with the measured
    #   0.189 deg wheel-angle noise at dt = 0.01.
    measurement_std: [0.04592, 0.4665]

objective:
  # relaxed to achievable values, and `penalty` raised clear of the achievable
  # cost range - with this much sensor noise the default 5%/1s targets saturate
  # the hinges for every candidate and make diverging cheaper than balancing.
  Mp_desired: 15.0
  Mp_max: 40.0
  Ts_desired: 2.0
  Ts_max: 6.0
  penalty: 5000.0
  w_error: 100.0
  w_control: 0.1
  w_overshoot: 100.0
  w_settling: 100.0
  U_max: 12.0
  w_saturation: 10.0
  PM_min: 30.0
  GM_min: 6.0
  w_phase_margin: 50.0       # robustness term ON (docs/papers/...md §7)
  w_gain_margin: 20.0

search_space:
  # V bounds WIDENED: the originals were set for the guessed noise and both
  # excluded the measured values (ln var -6.16 and -1.52), so the tuner was
  # physically unable to express how bad the real sensors are and would have
  # been forced to over-trust them at any budget.
  lower_bounds: [ 0.0, -1.0, -7.0, -7.0,  -1.0,  -19.0, -15.0, -19.0, -11.0,  -12.0,  -8.0]
  upper_bounds: [ 4.0,  2.0, -2.0, -2.0,   2.0,   -8.0,  -8.0,  -8.0,  -6.0,   -4.0,   1.0]

gp:
  kernel: matern52
  signal_variance: 1.0
  noise_variance: 1.0e-2

acquisition:
  kind: entropy_search
  params:
    n_optimum_samples: 200
    n_representers: 50
    n_fantasies: 10
    n_candidates: 200

optimization:
  n_initial: 8
  n_iterations: 20
  n_rollouts_per_eval: 1
  optimize_hyperparameters: true
