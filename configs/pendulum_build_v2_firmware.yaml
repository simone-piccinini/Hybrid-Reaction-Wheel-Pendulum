# As-built plant (v2 PLA wheel) WITH THE FIRMWARE'S REAL LIMITS APPLIED.
#
# pendulum_build_v2.yaml models the plant as designed. This one models what the
# v6 firmware + Teensy actually deliver, so the tuner optimises against the real
# actuator rather than an idealised motor.
#
# WHAT THIS CAPTURES
#   dt: 0.02       encoder B (pivot angle, I2C) updates at 50 Hz, not 1 kHz —
#                  a 500 us I2C read is half the control period, so the firmware
#                  reads it every 20 ms. The pendulum-angle estimate cannot
#                  update faster than its slowest sensor, so 50 Hz is the honest
#                  bottleneck. Verified: catch angle at 50 Hz is identical to
#                  100 Hz (10.54 deg), so this costs nothing here.
#   max_voltage    the PEAK rail, assuming the duty-ceiling fix of
#     / U_max      docs/hardware/thermal_and_duty_limits.md §5. With the SHIPPED
#                  firmware (dutyCap 250, throttled to ~223) this is 2.62 V and
#                  the plant is uncontrollable (2.28 deg catch). Set 12.0 only
#                  once the ceiling is raised and the bench current check passes.
#
# WHAT THIS DOES *NOT* CAPTURE  (be aware before trusting the gains)
#   - Transport delay. The simulator has no delay model at all. The ~11.5 ms
#     typical / 21.5 ms worst-case latency stack (control period + ZOH + encoder
#     B age) is NOT represented. Against a measured 58.6 ms delay margin that is
#     20-37% of the budget, spent silently.
#   - Coulomb friction / stiction. Only viscous b_p, and it is a placeholder.
#     Expect limit cycles near equilibrium that this model cannot show.
#   - Cogging torque (42 cycles/rev), thermal derating, slip-ring noise on the
#     analog channel.
#
# NOTE ON SAMPLE RATE: raising the rate to the firmware's true 1 kHz (dt 0.001)
# makes the hand-written DARE value iteration exceed its default max_iter=1000
# (it needs ~5000; A_d -> I as dt -> 0 and the contraction rate collapses). The
# failure presents as "cannot stabilise", which is misleading — it is the solver
# giving up, not the plant. Pass a larger max_iter if you tune at 1 kHz.

name: pendulum_build_v2_firmware

seed: 0

plant:
  pendulum_mass: 0.101       # m_tip: 60 g fixed + 41 g wheel (kg)
  pendulum_length: 0.15
  body_inertia: 0.0022725    # m_tip * L^2
  pivot_friction: 0.01       # PLACEHOLDER - not measured
  gravity: 9.81
  wheel:
    mass: 0.04100541
    radius: 0.051
    inertia: 6.11725e-5      # 61.1725 kg*mm^2 (Onshape). Rotor bell adds
                             # ~4.5e-6 once measured - the wheel bolts to it.
    friction_coefficient: 1.0e-4
  motor:
    resistance: 10.0         # ASSUMED per-phase; verify (see thermal doc §5)
    torque_constant: 0.037   # datasheet rows disagree: 0.037 / 0.0429 / 0.0618
    back_emf_constant: 0.037 # identify empirically before trusting the gains
    max_voltage: 12.0        # peak rail AFTER the duty-ceiling fix

simulation:
  dt: 0.02                   # 50 Hz - encoder B (pivot) is the bottleneck
  simulation_time: 10.0
  initial_state: [0.05, 0.0, 0.0, 0.0]
  divergence_angle: 1.5708
  disturbances:
    # NOTE: process_std is per-STEP, not per-unit-time (no sqrt(dt) scaling in
    # simulation/disturbances.py), so these values are only meaningful at the dt
    # above. Do not compare costs across different dt without rescaling.
    process_std: [0.0, 1.0e-4, 0.0, 1.0e-2]
    measurement_std: [1.0e-3, 1.0e-2]   # replace with MEASURED encoder noise:
                                        # B (I2C) 0.088 deg/count quantisation,
                                        # A (analog) 0.2-0.35 deg + slip-ring
                                        # correlated noise

objective:
  # Targets must be ACHIEVABLE or the hinges saturate for every candidate and
  # stop discriminating (the lesson pendulum_sensible.yaml records). With the
  # default 5%/1s targets a GOOD controller here scores overshoot 349 +
  # settling 896 = 1245, which EXCEEDS the divergence penalty - so the tuner
  # correctly learns that falling over is cheaper than balancing, and every
  # run diverges. Both numbers below are relaxed to what this plant can reach;
  # `penalty` is also raised clear of the achievable cost range.
  Mp_desired: 15.0
  Mp_max: 40.0
  Ts_desired: 2.0
  Ts_max: 6.0
  penalty: 5000.0            # MUST stay above any stabilising controller's cost
  w_error: 100.0
  w_control: 0.1
  w_overshoot: 100.0
  w_settling: 100.0
  U_max: 12.0                # match the peak rail
  w_saturation: 10.0
  PM_min: 30.0               # robustness term ON - delay margin is the scarce
  GM_min: 6.0                # resource here (see the latency stack above)
  w_phase_margin: 50.0
  w_gain_margin: 20.0

search_space:
  lower_bounds: [ 0.0, -1.0, -7.0, -7.0,  -1.0,  -19.0, -15.0, -19.0, -11.0,  -15.0, -11.0]
  upper_bounds: [ 4.0,  2.0, -2.0, -2.0,   2.0,   -8.0,  -8.0,  -8.0,  -6.0,   -8.0,  -6.0]

gp:
  kernel: matern52
  signal_variance: 1.0
  noise_variance: 1.0e-2

acquisition:
  kind: entropy_search
  params:
    n_optimum_samples: 200
    n_representers: 50
    n_fantasies: 10
    n_candidates: 200

optimization:
  n_initial: 8
  n_iterations: 20
  n_rollouts_per_eval: 1
  optimize_hyperparameters: true
